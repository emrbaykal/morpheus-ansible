---
# Operational workflow, target = the RustFS instance. Form inputs: rustfs_bucket_name,
# rustfs_bucket_access_key, rustfs_bucket_secret_key, rustfs_bucket_policy.
- hosts: all
  gather_facts: true
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_user: ansible
    ansible_ssh_private_key_file: /opt/morpheus/.local/.ssh/id_rsa
  roles:
       - role: 23-ubuntu-rustfs-bucket
         tags:
           - role::rustfs-bucket
