---
# Post Provision phase. Morpheus runs this phase on every node of the instance, also when a
# node is added later, so each node refreshes its /etc/hosts and only the new node joins.
# The control plane is skipped for the join role: its hostname equals the instance name.
- hosts: all
  gather_facts: true
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_user: ansible
    ansible_ssh_private_key_file: /opt/morpheus/.local/.ssh/id_rsa
  roles:
       - role: 19-ubuntu-hosts-file
         tags:
           - role::k8-worker-node::hosts-file

       # Both tags kept on one entry: the Morpheus task may select either of them.
       - role: 08-ubuntu-kubernetes-join-node
         when: ansible_facts['hostname'] != morpheus['instance']['name']
         tags:
           - role::k8-worker-node::kubernetes-join-node
           - role::k8-worker-node::kubernetes-join-node-operational
