---
# Post Provision phase, after the k8getjoin Groovy task. Runs on every node; both roles
# skip the control plane (the node whose hostname equals the instance name).
- hosts: all
  gather_facts: true
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_user: ansible
    ansible_ssh_private_key_file: /opt/morpheus/.local/.ssh/id_rsa
  roles:
       # Adds this instance's node list to the controller's /etc/hosts as well, so a
       # controller built earlier learns about nodes added to the instance later.
       - role: 19-ubuntu-hosts-file
         vars:
           hosts_file_controller_only: true
         tags:
           - role::k8-worker-node::hosts-file

       # Both tags kept on one entry: the Morpheus task may select either of them.
       - role: 08-ubuntu-kubernetes-join-node
         when: ansible_facts['hostname'] != morpheus['instance']['name']
         tags:
           - role::k8-worker-node::kubernetes-join-node
           - role::k8-worker-node::kubernetes-join-node-operational
