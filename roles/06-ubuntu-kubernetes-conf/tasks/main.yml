---
- name: Install required packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: true

- name: Create directory for apt keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# apt_key is deprecated; download the key and convert it the way the Kubernetes
# install guide does. "creates" keeps a keyring written by an earlier run.
- name: Download the Kubernetes apt key
  get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ morpheus['customOptions']['kubernetes_vers'] }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'

- name: Convert the Kubernetes apt key to a binary keyring
  command: >-
    gpg --batch --yes --dearmor
    -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    /etc/apt/keyrings/kubernetes-apt-keyring.asc
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes repository to apt sources
  apt_repository:
    filename: kubernetes
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ morpheus['customOptions']['kubernetes_vers'] }}/deb/ /"
    state: present

- name: Install Kubernetes packages
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present

# Keep every node on the same version: a later "apt upgrade" must not move one node ahead.
- name: Hold Kubernetes packages
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
