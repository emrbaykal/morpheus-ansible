---
# Control plane only (gated in ubuntu-k8-metalb-conf.yml). Everything runs through kubectl
# with admin.conf: no Python Kubernetes client and no collection are needed.
# kubectl apply is idempotent, so the role also updates an existing installation - which is
# how a changed metalb_ip_range reaches the cluster.

- name: Install MetalLB
  command: >-
    kubectl --kubeconfig {{ k8s_admin_kubeconfig }}
    apply -f https://raw.githubusercontent.com/metallb/metallb/{{ metallb_version }}/config/manifests/metallb-native.yaml
  register: metallb_apply
  changed_when: metallb_apply.stdout is search('created|configured')

- name: Wait for the MetalLB controller
  command: >-
    kubectl --kubeconfig {{ k8s_admin_kubeconfig }}
    -n metallb-system rollout status deployment/controller
    --timeout={{ metallb_ready_timeout }}s
  changed_when: false

- name: Wait for the MetalLB speakers
  command: >-
    kubectl --kubeconfig {{ k8s_admin_kubeconfig }}
    -n metallb-system rollout status daemonset/speaker
    --timeout={{ metallb_ready_timeout }}s
  changed_when: false

- name: Write the address pool manifest
  template:
    src: metallb-pool.yml.j2
    dest: "{{ ansible_env.HOME }}/metallb-pool.yml"
    mode: '0644'

# The validating webhook of the controller may refuse the first attempts while its
# certificate is still being issued, so this is retried instead of failing the workflow.
- name: Apply the address pool and the L2 advertisement
  command: >-
    kubectl --kubeconfig {{ k8s_admin_kubeconfig }}
    apply -f {{ ansible_env.HOME }}/metallb-pool.yml
  register: metallb_pool
  until: metallb_pool.rc == 0
  retries: 12
  delay: 10
  changed_when: metallb_pool.stdout is search('created|configured')
