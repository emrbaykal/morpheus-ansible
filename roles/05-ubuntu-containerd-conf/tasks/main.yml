---
- name: Install required packages
  apt:
    name:
      - ca-certificates
      - curl
      - nfs-common
    state: present
    update_cache: true

- name: Create directory for apt keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository to apt sources
  apt_repository:
    filename: docker
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install containerd.io
  apt:
    name: containerd.io
    state: present

# The configuration is generated from the installed containerd instead of shipping a
# fixed file, so it always matches the containerd version the Docker repository delivers.
- name: Generate the default containerd configuration
  command: containerd config default
  register: containerd_default
  changed_when: false

- name: Check that the default configuration has the cgroup driver setting
  assert:
    that:
      - "'SystemdCgroup = false' in containerd_default.stdout"
    fail_msg: "containerd config default has no 'SystemdCgroup = false' line; review this role for the installed containerd version."
    quiet: true

- name: Write the containerd configuration with the systemd cgroup driver
  copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_default.stdout | replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
    owner: root
    group: root
    mode: '0644'
  notify: containerd-service

- name: Apply the containerd configuration
  meta: flush_handlers
