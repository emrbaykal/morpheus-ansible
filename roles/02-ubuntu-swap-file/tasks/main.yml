---
# kubelet refuses to start while swap is on. Turn off every swap device, not only
# the /swap.img file of the Ubuntu installer, and keep it off after a reboot.
- name: Turn off all swap
  command: swapoff -a
  when: (ansible_facts['swaptotal_mb'] | int) > 0

- name: Comment out swap entries in /etc/fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#\s]\S*\s+\S+\s+swap\s.*)$'
    replace: '# \1'

- name: Remove the installer swap file
  file:
    path: /swap.img
    state: absent

- name: Mask swap.target so no swap unit is activated at boot
  systemd:
    name: swap.target
    masked: true
