---
# Kernel prerequisites from the Kubernetes container runtime guide.
- name: Load the Kubernetes kernel modules at boot
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Load the kernel modules now
  command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Set sysctl parameters for Kubernetes
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
    mode: '0644'

# The bridge keys only exist once br_netfilter is loaded, so this runs after it, every time.
- name: Apply sysctl parameters
  command: sysctl --system
  changed_when: false
