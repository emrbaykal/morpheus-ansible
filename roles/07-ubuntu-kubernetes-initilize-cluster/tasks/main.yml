---
# Control plane only (gated in ubuntu-k8-initilize-cluster.yml).
# All cluster calls use kubectl with admin.conf; no Python Kubernetes client is needed.

- name: Wait for cloud-init to finish
  command: cloud-init status --wait
  register: cloud_init_wait
  changed_when: false
  # rc 2 = finished with recoverable errors; a missing cloud-init must not stop the role.
  failed_when: false

- name: Initialize the Kubernetes control plane
  command: >-
    kubeadm init
    --pod-network-cidr={{ morpheus['customOptions']['pod_cidr'] }}
    --v=5
  args:
    creates: "{{ k8s_admin_kubeconfig }}"

- name: Create the .kube directory
  file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: '0755'

- name: Copy admin.conf to the kube config of the become user
  copy:
    remote_src: true
    src: "{{ k8s_admin_kubeconfig }}"
    dest: "{{ ansible_env.HOME }}/.kube/config"
    owner: "{{ ansible_user_uid }}"
    group: "{{ ansible_user_gid }}"
    mode: '0600'

- name: Wait for the API server to report ready
  command: kubectl --kubeconfig {{ k8s_admin_kubeconfig }} get --raw=/readyz
  register: api_ready
  until: api_ready.rc == 0
  retries: "{{ (k8s_ready_timeout | int) // 5 }}"
  delay: 5
  changed_when: false

- name: Download the Flannel manifest
  get_url:
    url: "https://github.com/flannel-io/flannel/releases/download/{{ flannel_version }}/kube-flannel.yml"
    dest: "{{ ansible_env.HOME }}/kube-flannel-{{ flannel_version }}.yml"
    mode: '0644'

- name: Set the pod network CIDR in the Flannel manifest
  replace:
    path: "{{ ansible_env.HOME }}/kube-flannel-{{ flannel_version }}.yml"
    regexp: '"Network": "[^"]*"'
    replace: "\"Network\": \"{{ morpheus['customOptions']['pod_cidr'] }}\""

# kubectl apply is idempotent, so the manifest is applied on every run.
- name: Apply the Flannel manifest
  command: kubectl --kubeconfig {{ k8s_admin_kubeconfig }} apply -f {{ ansible_env.HOME }}/kube-flannel-{{ flannel_version }}.yml
  register: flannel_apply
  changed_when: flannel_apply.stdout is search('created|configured')

- name: Wait for the control plane node to become Ready
  command: >-
    kubectl --kubeconfig {{ k8s_admin_kubeconfig }}
    wait --for=condition=Ready node/{{ ansible_facts['nodename'] | lower }}
    --timeout={{ k8s_ready_timeout }}s
  changed_when: false

- name: Wait for CoreDNS
  command: >-
    kubectl --kubeconfig {{ k8s_admin_kubeconfig }}
    -n kube-system rollout status deployment/coredns
    --timeout={{ k8s_ready_timeout }}s
  changed_when: false
