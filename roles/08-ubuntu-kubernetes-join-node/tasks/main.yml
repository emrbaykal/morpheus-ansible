---
# The join token is fetched from the control plane over the same SSH connection Ansible
# already uses (delegate_to with the IP Morpheus holds for that node), so no separate task
# script and no second set of credentials are involved. The delegated tasks run without
# become, against the kubeconfig role 07 left for the SSH user.

- name: Check if node is already part of a cluster
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join Kubernetes worker node
  when: not kubelet_conf.stat.exists
  block:
    # kubeadm writes admin.conf before the API server is up, so the file alone is no proof.
    - name: Wait for the control plane API server
      command: kubectl --kubeconfig {{ k8s_remote_kubeconfig }} get --raw=/readyz
      delegate_to: "{{ k8s_controller_ip }}"
      become: false
      register: k8s_api_ready
      until: k8s_api_ready.rc == 0
      retries: "{{ (k8s_api_wait | int) // 10 }}"
      delay: 10
      changed_when: false

    - name: Create a join token on the control plane
      command: >-
        kubeadm token create --print-join-command
        --ttl {{ k8s_join_token_ttl }}
        --kubeconfig {{ k8s_remote_kubeconfig }}
      delegate_to: "{{ k8s_controller_ip }}"
      become: false
      register: k8s_join_command
      changed_when: true

    - name: Join Kubernetes cluster
      command: >-
        {{ k8s_join_command.stdout | trim }}
        {{ ('--ignore-preflight-errors=' ~ kubeadm_join_ignore_preflight) if kubeadm_join_ignore_preflight else '' }}

  rescue:
    # A half-finished join leaves files behind that make the next attempt fail preflight.
    - name: Reset the node after a failed join
      command: kubeadm reset --force

    - name: Report the failed join
      fail:
        msg: "kubeadm join failed; the node was reset, re-run the task"

# Outside the block above: a slow kubelet must not trigger the reset in its rescue.
- name: Wait for kubelet to become healthy
  uri:
    url: http://127.0.0.1:10248/healthz
  register: kubelet_health
  until: kubelet_health.status | default(-1) == 200
  retries: 30
  delay: 5
  when: not kubelet_conf.stat.exists

# Runs on every pass, so a re-run also fixes a missing label.
- name: Label this node as a worker
  command: >-
    kubectl --kubeconfig {{ k8s_remote_kubeconfig }}
    label node {{ ansible_facts['nodename'] | lower }}
    node-role.kubernetes.io/worker=worker --overwrite
  delegate_to: "{{ k8s_controller_ip }}"
  become: false
  changed_when: true

# kubectl on the worker itself, as root, without copying credentials by hand.
- name: Read the kubeconfig from the control plane
  slurp:
    src: "{{ k8s_remote_kubeconfig }}"
  delegate_to: "{{ k8s_controller_ip }}"
  become: false
  register: k8s_kubeconfig_remote

- name: Create the .kube directory of root
  file:
    path: "{{ k8s_root_kubeconfig | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Write the kubeconfig into root's profile
  copy:
    content: "{{ k8s_kubeconfig_remote.content | b64decode }}"
    dest: "{{ k8s_root_kubeconfig }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
