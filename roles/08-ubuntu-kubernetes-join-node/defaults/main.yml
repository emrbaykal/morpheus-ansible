---
# kubeconfig of the SSH user on the control plane, written by role 07. Used by the tasks
# delegated there, so they need no sudo: Morpheus supplies the sudo password only for the
# node the playbook targets, not for a delegation target.
k8s_remote_kubeconfig: "/home/{{ ansible_user }}/.kube/config"

# Control plane = the node of this instance whose hostname equals the instance name.
# Kept as a default, not a set_fact: delegate_to is templated even for a skipped task.
k8s_controller_ip: >-
  {{ (morpheus['instance']['containers']
      | selectattr('hostname', 'equalto', morpheus['instance']['name']) | first).internalIp }}

# kubeconfig placed in root's profile on this node, copied from the control plane.
k8s_root_kubeconfig: /root/.kube/config

# Lifetime of the bootstrap token created for this node.
k8s_join_token_ttl: 1h

# Seconds to wait for the control plane API server; kubeadm init may still be running there.
k8s_api_wait: 900

# Comma-separated kubeadm preflight checks to ignore, e.g. "Swap". Empty by default:
# roles 02 and 03 prepare the node so every check should pass.
kubeadm_join_ignore_preflight: ""
