---
# Prepares the data disks for RustFS: XFS with a label, mounted at /data/rustfs<n>.
# RustFS is built and tested on XFS and expects raw disks (JBOD), not RAID or NFS.
# Only builtin modules are used, so no Ansible collection is required on the appliance.

- name: Find the data disks
  shell: |
    set -o pipefail
    lsblk -nd -o NAME | grep -vE '{{ rustfs_system_disks }}' | awk '{print "/dev/"$1}'
  args:
    executable: /bin/bash
  register: rustfs_disks
  changed_when: false

- name: Check that at least one data disk is present
  assert:
    that:
      - rustfs_disks.stdout_lines | length > 0
    fail_msg: "No data disk found besides the system disk; RustFS needs at least one."
    quiet: true

- name: Read the filesystem of the data disks
  command: blkid -o value -s TYPE {{ item }}
  register: rustfs_disk_fstype
  loop: "{{ rustfs_disks.stdout_lines }}"
  failed_when: false
  changed_when: false

- name: Format the unformatted data disks with XFS
  command: mkfs.xfs -i size=512 -n ftype=1 -L RUSTFS{{ index }} {{ item.item }}
  loop: "{{ rustfs_disk_fstype.results }}"
  loop_control:
    index_var: index
    label: "{{ item.item }}"
  when: item.stdout | trim == ''

# Explicit, because a mount point created on its own would give this directory the same
# restrictive mode and the service user could not traverse it.
- name: Create the data root
  file:
    path: "{{ rustfs_data_root }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create the mount points
  file:
    path: "{{ rustfs_data_root }}/rustfs{{ index }}"
    state: directory
    mode: '0755'
  loop: "{{ rustfs_disks.stdout_lines }}"
  loop_control:
    index_var: index

# Mounted by label, so a device rename after a reboot cannot swap the volumes.
- name: Add the data disks to /etc/fstab
  lineinfile:
    path: /etc/fstab
    regexp: '^LABEL=RUSTFS{{ index }}\s'
    line: "LABEL=RUSTFS{{ index }} {{ rustfs_data_root }}/rustfs{{ index }} xfs defaults,noatime,nodiratime 0 0"
  loop: "{{ rustfs_disks.stdout_lines }}"
  loop_control:
    index_var: index

- name: Mount the data disks
  command: mount -a
  changed_when: false
