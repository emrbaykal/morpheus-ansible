---
# Removes this node from the cluster before Morpheus deletes the VM. Drain and delete run on
# the control plane through Ansible's own SSH connection (delegate_to), the reset and the
# cleanup run here. Nothing in this role may block the deletion of the VM, so a control plane
# that is already gone is reported and skipped, and every step tolerates a re-run.

- name: Check if node is part of a cluster
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Remove this node from the cluster
  when: kubelet_conf.stat.exists
  block:
    - name: Drain the node on the control plane
      command: >-
        kubectl --kubeconfig {{ k8s_remote_kubeconfig }}
        drain {{ k8s_node_name }}
        --ignore-daemonsets --delete-emptydir-data --force
        --timeout={{ k8s_drain_timeout }}s
      delegate_to: "{{ k8s_controller_ip }}"
      become: false
      register: k8s_drain
      failed_when: k8s_drain.rc != 0 and 'not found' not in k8s_drain.stderr
      changed_when: k8s_drain.rc == 0

    - name: Delete the node object on the control plane
      command: >-
        kubectl --kubeconfig {{ k8s_remote_kubeconfig }}
        delete node {{ k8s_node_name }} --ignore-not-found
      delegate_to: "{{ k8s_controller_ip }}"
      become: false
      changed_when: true

  rescue:
    # In Teardown the control plane is often already gone. Removing this node from a cluster
    # that no longer exists is pointless and must not fail the workflow.
    - name: Report that the cluster could not be reached
      debug:
        msg: >-
          Could not remove {{ k8s_node_name }} from the cluster
          ({{ ansible_failed_result.msg | default('unknown') }}). Continuing with the local cleanup.

- name: Clean up the local Kubernetes state
  when: kubelet_conf.stat.exists
  block:
    - name: Reset kubeadm on this node
      command: kubeadm reset --force

    - name: Remove the CNI configuration
      file:
        path: /etc/cni/net.d
        state: absent

- name: Remove the kube configs
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.kube
    - "/home/{{ ansible_user }}/.kube"

- name: Remove Kubernetes packages
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: absent
    purge: true
  when: k8s_drain_purge_packages | bool
