---
- name: Write every node of the instance to /etc/hosts
  blockinfile:
    path: /etc/hosts
    marker: "# {mark} MORPHEUS INSTANCE NODES (managed by Ansible)"
    block: "{{ lookup('template', 'hosts_block.j2') }}"

# Provisioning writes "127.0.0.1 <fqdn> <hostname> localhost" above the block, so without
# this the node keeps resolving its own name to loopback.
- name: Stop resolving this node's own names to 127.0.0.1
  replace:
    path: /etc/hosts
    regexp: '(?i)^(127\.0\.0\.1(?:[ \t]+\S+)*?)[ \t]+{{ item | regex_escape }}(?=[ \t]|$)'
    replace: '\1'
  loop:
    - "{{ inventory_hostname }}"
    - "{{ ansible_facts['hostname'] }}"

- name: Remove the 127.0.1.1 entry inherited from the template image
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1[ \t]'
    state: absent
