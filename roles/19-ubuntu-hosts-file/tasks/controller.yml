---
# Delegated from a worker so a controller built earlier also learns about nodes added later.
- name: Find the controller IP
  set_fact:
    hosts_file_controller_ip: >-
      {{ (hosts_file_nodes | selectattr('hostname', 'equalto', morpheus['instance']['name']) | first).internalIp }}

- name: Write every node of the instance to the controller's hosts file
  blockinfile:
    path: /etc/hosts
    marker: "# {mark} MORPHEUS INSTANCE NODES (managed by Ansible)"
    block: "{{ lookup('template', 'hosts_block.j2') }}"
  delegate_to: "{{ hosts_file_controller_ip }}"
  when: ansible_facts['hostname'] != morpheus['instance']['name']
