---
# Every node of the instance comes from morpheus['instance']['containers'], which already
# holds hostname and internalIp during the Provision phase (verified 2026-09-17).

- name: Build the node list from the Morpheus instance
  set_fact:
    hosts_file_nodes: >-
      {{ morpheus['instance']['containers'] | default([])
         | selectattr('hostname', 'defined') | selectattr('hostname')
         | selectattr('internalIp', 'defined') | selectattr('internalIp')
         | sort(attribute='hostname') | list }}

- name: Update this node's hosts file
  include_tasks: local.yml
